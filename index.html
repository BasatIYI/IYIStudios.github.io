<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Old hash URLs (/#/games-apps, /#/gokboru, …) → clean URLs.
    (function (l) {
      if (l.hash.indexOf("#/") !== 0) return;
      var path = l.hash.slice(1).split("?")[0];
      var moved = { "/games-apps": "/games" };
      l.replace((moved[path] || path) + l.search);
    })(window.location);
    // Hide the announcement bar before first paint if it was dismissed (key: see AnnouncementBar.tsx).
    try {
      if (localStorage.getItem("iyi:announcement:gokboru-wishlist") === "dismissed") {
        document.documentElement.setAttribute("data-announcement-dismissed", "");
      }
    } catch (e) { }
  </script>
  <link rel="icon" type="image/png" href="/media/branding/favicon.png" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="IYI Studios" />
  <!-- TODO(placeholder): og-image.png is a placeholder (1200×630 PNG) -->
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@IYIStudios" />
  <!-- Per-page title, description, canonical, Open Graph and Twitter tags are injected by scripts/prerender.mjs -->
  <!--app-head-->
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
