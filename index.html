  <script>
    // Hide the announcement bar before first paint if it was dismissed (key: see AnnouncementBar.tsx).
    try {
      if (localStorage.getItem("iyi:announcement:gokboru-wishlist") === "dismissed") {
        document.documentElement.setAttribute("data-announcement-dismissed", "");
      }
    } catch (e) { }
  </script>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- 404 Hack for GH Pages SPA -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</body>
